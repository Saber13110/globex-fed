<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4AFF"/>
      <stop offset="100%" stop-color="#8B73FF"/>
    </linearGradient>
    <linearGradient id="pGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D4AFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B73FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF9A4D"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B73FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6D4AFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6D4AFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aiCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#6D4AFF"/>
      <stop offset="100%" stop-color="#4C2DB8"/>
    </radialGradient>
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9B85FF"/>
      <stop offset="100%" stop-color="#6D4AFF"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6D4AFF" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a0033" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="480" cy="270" rx="280" ry="200" fill="url(#coreGlow)"/>

  <!-- Orbital rings -->
  <ellipse cx="480" cy="268" rx="220" ry="88" stroke="#6D4AFF" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6 10"/>
  <ellipse cx="480" cy="268" rx="185" ry="72" stroke="#8B73FF" stroke-width="1.2" stroke-opacity="0.18"/>
  <circle cx="480" cy="268" r="155" stroke="url(#pGrad)" stroke-width="1.5" stroke-opacity="0.22"/>
  <circle cx="480" cy="268" r="125" stroke="#6D4AFF" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>

  <!-- Neural network particles -->
  <g opacity="0.65">
    <circle cx="340" cy="180" r="3" fill="#8B73FF"/>
    <circle cx="620" cy="195" r="2.5" fill="#6D4AFF"/>
    <circle cx="380" cy="340" r="2" fill="#8B73FF"/>
    <circle cx="580" cy="355" r="3" fill="#6D4AFF"/>
    <circle cx="420" cy="120" r="2" fill="#FF7A1A" opacity="0.7"/>
    <circle cx="540" cy="400" r="2.5" fill="#FF7A1A" opacity="0.6"/>
    <path d="M340 180 L420 220 L480 248" stroke="#8B73FF" stroke-width="0.8" stroke-opacity="0.25"/>
    <path d="M620 195 L560 230 L520 255" stroke="#6D4AFF" stroke-width="0.8" stroke-opacity="0.25"/>
    <path d="M380 340 L440 300 L480 275" stroke="#8B73FF" stroke-width="0.8" stroke-opacity="0.2"/>
    <path d="M580 355 L520 310 L500 285" stroke="#6D4AFF" stroke-width="0.8" stroke-opacity="0.2"/>
  </g>

  <!-- Floating package cubes -->
  <g filter="url(#cardShadow)">
    <g transform="translate(155, 320) rotate(-12)">
      <rect width="44" height="44" rx="10" fill="rgba(109,74,255,0.12)" stroke="#6D4AFF" stroke-width="1.2" stroke-opacity="0.45"/>
      <path d="M0 14 L22 2 L44 14" stroke="#6D4AFF" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
      <line x1="22" y1="2" x2="22" y2="44" stroke="#6D4AFF" stroke-width="1.2" stroke-opacity="0.35"/>
    </g>
    <g transform="translate(760, 300) rotate(8)">
      <rect width="38" height="38" rx="9" fill="rgba(139,115,255,0.14)" stroke="#8B73FF" stroke-width="1.2" stroke-opacity="0.5"/>
      <path d="M0 12 L19 3 L38 12" stroke="#8B73FF" stroke-width="1" stroke-opacity="0.45" fill="none"/>
    </g>
    <g transform="translate(720, 130) rotate(-6)">
      <rect width="32" height="32" rx="8" fill="rgba(255,122,26,0.1)" stroke="#FF7A1A" stroke-width="1" stroke-opacity="0.4"/>
    </g>
  </g>

  <!-- Analytics card (left) -->
  <g filter="url(#cardShadow)" transform="translate(72, 168)">
    <rect width="168" height="118" rx="18" fill="rgba(255,255,255,0.88)" stroke="rgba(109,74,255,0.18)" stroke-width="1.2"/>
    <rect x="14" y="14" width="48" height="6" rx="3" fill="rgba(109,74,255,0.15)"/>
    <rect x="14" y="28" width="72" height="4" rx="2" fill="rgba(100,116,139,0.2)"/>
  <!-- Bar chart -->
    <rect x="24" y="78" width="14" height="24" rx="4" fill="#6D4AFF" fill-opacity="0.35"/>
    <rect x="46" y="66" width="14" height="36" rx="4" fill="#6D4AFF" fill-opacity="0.55"/>
    <rect x="68" y="54" width="14" height="48" rx="4" fill="url(#pGrad)"/>
    <rect x="90" y="62" width="14" height="40" rx="4" fill="#8B73FF" fill-opacity="0.7"/>
    <rect x="112" y="48" width="14" height="54" rx="4" fill="#6D4AFF"/>
  <!-- Line spark -->
    <path d="M24 52 L50 44 L76 50 L102 38 L128 42" stroke="#FF7A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75"/>
    <circle cx="128" cy="42" r="3.5" fill="#FF7A1A"/>
  </g>

  <!-- Logistics globe (top) -->
  <g filter="url(#softShadow)" transform="translate(408, 42)">
    <circle cx="72" cy="72" r="58" fill="url(#globeGrad)" fill-opacity="0.92"/>
    <ellipse cx="72" cy="72" rx="58" ry="20" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <ellipse cx="72" cy="72" rx="20" ry="58" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
    <path d="M14 72 H130" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
    <path d="M72 14 V130" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <path d="M30 38 Q72 58 114 38" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" fill="none"/>
    <path d="M30 106 Q72 86 114 106" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" fill="none"/>
    <circle cx="72" cy="72" r="62" stroke="rgba(109,74,255,0.25)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Tracking dashboard card (right) -->
  <g filter="url(#cardShadow)" transform="translate(720, 175)">
    <rect width="168" height="128" rx="18" fill="rgba(255,255,255,0.9)" stroke="rgba(109,74,255,0.18)" stroke-width="1.2"/>
    <rect x="14" y="14" width="56" height="6" rx="3" fill="rgba(109,74,255,0.2)"/>
    <rect x="14" y="30" width="90" height="4" rx="2" fill="rgba(100,116,139,0.18)"/>
    <!-- Tracking rows -->
    <rect x="14" y="48" width="140" height="22" rx="8" fill="rgba(109,74,255,0.06)"/>
    <rect x="22" y="55" width="36" height="4" rx="2" fill="#6D4AFF" fill-opacity="0.5"/>
    <rect x="22" y="62" width="52" height="3" rx="1.5" fill="rgba(100,116,139,0.25)"/>
    <circle cx="142" cy="59" r="5" fill="#22C55E" fill-opacity="0.85"/>
    <rect x="14" y="76" width="140" height="22" rx="8" fill="rgba(255,122,26,0.06)"/>
    <rect x="22" y="83" width="40" height="4" rx="2" fill="#FF7A1A" fill-opacity="0.55"/>
    <rect x="22" y="90" width="48" height="3" rx="1.5" fill="rgba(100,116,139,0.25)"/>
    <circle cx="142" cy="87" r="5" fill="#FF7A1A" fill-opacity="0.8"/>
    <rect x="14" y="104" width="140" height="22" rx="8" fill="rgba(109,74,255,0.06)"/>
    <rect x="22" y="111" width="44" height="4" rx="2" fill="#8B73FF" fill-opacity="0.55"/>
    <circle cx="142" cy="115" r="5" fill="#6D4AFF" fill-opacity="0.7"/>
  </g>

  <!-- Holographic interface ring behind robot -->
  <circle cx="480" cy="278" r="98" fill="rgba(255,255,255,0.04)" stroke="rgba(109,74,255,0.2)" stroke-width="1.5"/>
  <circle cx="480" cy="278" r="82" fill="none" stroke="url(#pGrad)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="3 6"/>

  <!-- AI Robot (center) -->
  <g filter="url(#softShadow)" transform="translate(480, 278)">
    <!-- Antenna / core glow -->
    <circle cx="0" cy="-72" r="10" fill="#FF7A1A" fill-opacity="0.85" filter="url(#glow)"/>
    <line x1="0" y1="-62" x2="0" y2="-48" stroke="#8B73FF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Head -->
    <rect x="-52" y="-48" width="104" height="72" rx="26" fill="url(#aiCore)"/>
    <rect x="-52" y="-48" width="104" height="72" rx="26" fill="rgba(255,255,255,0.08)"/>
    <!-- Visor -->
    <rect x="-38" y="-32" width="76" height="28" rx="14" fill="rgba(15,10,35,0.35)"/>
  <!-- Eyes -->
    <circle cx="-18" cy="-18" r="7" fill="#fff"/>
    <circle cx="18" cy="-18" r="7" fill="#fff"/>
    <circle cx="-16" cy="-18" r="3" fill="#6D4AFF"/>
    <circle cx="20" cy="-18" r="3" fill="#6D4AFF"/>
    <!-- Smile indicator -->
    <path d="M-22 2 Q0 14 22 2" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <rect x="-44" y="28" width="88" height="64" rx="22" fill="url(#pGrad)"/>
    <rect x="-44" y="28" width="88" height="64" rx="22" fill="rgba(255,255,255,0.06)"/>
    <!-- AI core chest -->
    <circle cx="0" cy="58" r="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
    <circle cx="0" cy="58" r="10" fill="#fff" fill-opacity="0.9"/>
    <circle cx="0" cy="58" r="5" fill="#6D4AFF"/>
    <!-- Arms -->
    <rect x="-68" y="36" width="20" height="44" rx="10" fill="#8B73FF" fill-opacity="0.85"/>
    <rect x="48" y="36" width="20" height="44" rx="10" fill="#8B73FF" fill-opacity="0.85"/>
  </g>

  <!-- Delivery truck (bottom center) -->
  <g filter="url(#cardShadow)" transform="translate(368, 400)">
    <rect x="0" y="18" width="88" height="44" rx="10" fill="rgba(255,122,26,0.12)" stroke="#FF7A1A" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M88 32 H128 L148 52 V62 H88 Z" fill="rgba(255,122,26,0.18)" stroke="#FF7A1A" stroke-width="1.5" stroke-opacity="0.55" stroke-linejoin="round"/>
    <rect x="132" y="38" width="14" height="14" rx="3" fill="rgba(255,255,255,0.5)" stroke="#FF7A1A" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="28" cy="66" r="12" fill="#fff" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="28" cy="66" r="5" fill="#FF7A1A" fill-opacity="0.4"/>
    <circle cx="128" cy="66" r="12" fill="#fff" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="128" cy="66" r="5" fill="#FF7A1A" fill-opacity="0.4"/>
    <!-- Motion trail -->
    <path d="M-20 58 Q-8 54 0 58" stroke="#FF7A1A" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" fill="none"/>
    <path d="M-28 64 Q-14 60 0 64" stroke="#FF7A1A" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Smart automation nodes -->
  <g opacity="0.5">
    <rect x="268" y="248" width="28" height="28" rx="8" fill="rgba(109,74,255,0.1)" stroke="#6D4AFF" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M278 258 L288 268 M288 258 L278 268" stroke="#6D4AFF" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
    <rect x="664" y="248" width="28" height="28" rx="8" fill="rgba(139,115,255,0.1)" stroke="#8B73FF" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="678" cy="262" r="5" stroke="#8B73FF" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>
    <circle cx="678" cy="262" r="2" fill="#8B73FF" fill-opacity="0.6"/>
  </g>

  <!-- Light trails -->
  <path d="M200 270 Q340 250 480 268" stroke="url(#pGrad)" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  <path d="M760 270 Q620 250 480 268" stroke="url(#pGrad)" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
</svg>
